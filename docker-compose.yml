version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: brewery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brewery
      POSTGRES_USER: brewery_user
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: brewery_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # This tells Adminer to use the service name 'postgres' as default server
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"

volumes:
  postgres-data:
    driver: local

